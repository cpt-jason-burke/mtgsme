name: Build combo files

# Downloads the latest Commander Spellbook combos and commits the combos/ folder.
# Run it from the Actions tab (also works in the GitHub iPhone app or mobile site).
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_combos.py
      - .github/workflows/build-combos.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_combos.py
      - name: Commit combo files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add combos
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update Commander Spellbook combos"
          git push
