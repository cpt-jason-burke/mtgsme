name: Refresh card data

# Every 6 hours: fetch news headlines, and rebuild the card data only if the mtg.wtf source changed.
# Publishes only when something the app shows actually changed.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh
  push:                      # also run when the build itself changes
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the source for changes
        id: check
        run: |
          FILES="index/cards.jsonl index/rulings.jsonl index/banlist_history.json index/sets.json index/deck_index.json data/MagicCompRules.txt"
          git clone --quiet --depth 1 --filter=blob:none --no-checkout https://github.com/taw/magic-search-engine /tmp/mse
          cd /tmp/mse
          git ls-tree HEAD $FILES | awk '{print $3, $4}' > /tmp/source.txt
          # a change to the build itself (a push) always rebuilds; otherwise only when the source changed
          if [ "$GITHUB_EVENT_NAME" != "push" ] && diff -q /tmp/source.txt "$GITHUB_WORKSPACE/docs/data/source.txt" > /dev/null 2>&1; then
            echo "Card data unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git checkout HEAD -- $FILES
            git log -1 --format=%cs > /tmp/source-date.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the card data
        if: steps.check.outputs.changed == 'true'
        run: |
          cp /tmp/mse/data/MagicCompRules.txt rules_CR.txt
          python3 tools/build_site.py /tmp/mse
          rm -rf cards_lean cards_with_rulings
          python3 tools/build_cards.py /tmp/mse cards_lean lean
          python3 tools/build_cards.py /tmp/mse cards_with_rulings

      - name: Fetch news headlines
        run: python3 tools/fetch_news.py || echo "News fetch failed; keeping the previous headlines."

      - name: Publish only if something changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing the app uses changed. Not publishing."
            exit 0
          fi
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            cp /tmp/source.txt docs/data/source.txt
            cp /tmp/source-date.txt docs/data/source-date.txt
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > docs/data/built-at.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh data ($(cat docs/data/source-date.txt); news $(date -u +%Y-%m-%d))"
          git push
